# Pruebas en cada empujon y en cada pull request.
#
# La matriz incluye Python 3.9 a proposito: es el que traen las compilaciones
# de QGIS para macOS, y es donde aparecerian los usos de sintaxis o de numpy
# posteriores a esa version. Probar solo en el Python del dia siguiente deja
# ese agujero abierto justo para los usuarios que mas cuesta ayudar.
name: pruebas

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Bibliotecas que Qt necesita aun sin pantalla
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libgl1 libegl1 libdbus-1-3 libxkbcommon0 zip

      - name: Dependencias
        run: |
          python -m pip install --quiet --upgrade pip
          # numpy y pytest son obligatorios: sin ellos no hay nada que probar.
          python -m pip install --quiet numpy pytest pyflakes pycodestyle
          # El resto es opcional, igual que en la instalacion real. Si alguno
          # no tiene rueda para esta version de Python, las pruebas que lo
          # necesitan se saltan solas y el resto sigue corriendo: es el mismo
          # comportamiento que el plugin tiene delante del usuario.
          python -m pip install --quiet h5py || echo "sin h5py"
          python -m pip install --quiet PyQt5 pyqtgraph || echo "sin Qt"

      - name: Que hay instalado
        run: |
          python - <<'PY'
          import importlib.util as u
          for m in ("numpy", "h5py", "PyQt5", "pyqtgraph", "xarray", "osgeo"):
              print("%-10s %s" % (m, "si" if u.find_spec(m) else "NO"))
          PY

      # Se llama al mismo script que se corre a mano antes de empujar. Con
      # los comandos escritos dos veces se separan en un dia: asi paso la
      # primera vez, y el CI encontro un fallo de estilo que la comprobacion
      # local, escrita de memoria con otros argumentos, no miraba.
      - name: Pruebas, estilo y demo
        run: ./verificar.sh

  qt6:
    # QGIS se esta moviendo a Qt6 y ahi los enums sin calificar no existen.
    # Un trabajo aparte y no una entrada mas de la matriz: la vinculacion de
    # Qt se elige al importar, una vez por proceso, asi que PyQt5 y PyQt6 no
    # pueden convivir en la misma sesion. Aqui se instala solo PyQt6 y se
    # construye la interfaz de verdad; lo que el detector estatico no vea, se
    # cae al dibujar.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bibliotecas que Qt necesita aun sin pantalla
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libgl1 libegl1 libdbus-1-3 libxkbcommon0 libfontconfig1
      - run: python -m pip install --quiet numpy pytest PyQt6
      - name: La interfaz se construye y se dibuja con Qt6
        run: python comprobar_qt6.py
      - name: Y no queda ningun enum sin calificar
        run: python -m pytest hdfeos_extractor/tests/test_qt6.py -v

  paquete:
    # El ZIP se arma y se revisa en cada empujon, no solo al publicar. Un ZIP
    # con la forma equivocada no se nota hasta que alguien intenta instalarlo.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq zip
      - run: python -m pip install --quiet numpy pytest
      - name: Armar y revisar la forma del ZIP
        run: python -m pytest hdfeos_extractor/tests/test_paquete.py -v
      - name: Dejarlo descargable desde esta corrida
        run: ./empaquetar.sh
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-instalable
          path: hdfeos_extractor-*.zip
