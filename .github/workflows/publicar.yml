# Publica el ZIP instalable como Release.
#
# Es la respuesta al problema que se lleva a la gente por delante: el boton
# "Download ZIP" de GitHub entrega el codigo fuente con una carpeta raiz que
# QGIS no puede usar como nombre de modulo. Con un Release, el archivo que se
# ofrece para descargar es el ZIP correcto y ya no hay que explicar nada.
#
# Dos maneras de lanzarlo, y las dos terminan igual:
#
#   Desde la pestana Actions -> publicar -> "Run workflow". Toma la version de
#   metadata.txt, crea la etiqueta y publica. No hace falta git local.
#
#   Empujando una etiqueta:  git tag v2.0 && git push origin v2.0
name: publicar

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write          # hace falta para crear la etiqueta y el Release

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: sudo apt-get update -qq && sudo apt-get install -y -qq zip

      - run: python -m pip install --quiet numpy pytest

      - name: No se publica un ZIP mal formado
        run: python -m pytest hdfeos_extractor/tests/test_paquete.py -q

      - name: Resolver la version
        id: version
        run: |
          # La version manda desde metadata.txt, que es lo que QGIS lee. Si
          # viene por etiqueta se exige que coincidan: si no, el archivo
          # publicado diria una version y el plugin instalado otra.
          META=$(sed -n 's/^version=//p' hdfeos_extractor/metadata.txt)
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
            echo "metadata.txt: $META   etiqueta: ${TAG#v}"
            test "$META" = "${TAG#v}"
          else
            TAG="v$META"
            echo "lanzado a mano; la etiqueta sale de metadata.txt: $TAG"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Armar el ZIP
        run: ./empaquetar.sh

      - name: Publicar el Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          NOTAS=$(cat <<TXT
          Instalacion en QGIS: **Complementos -> Instalar a partir de ZIP**,
          eligiendo el \`hdfeos_extractor-*.zip\` de aca abajo.

          No uses el boton verde "Code -> Download ZIP": ese entrega el codigo
          fuente con una carpeta raiz que QGIS no puede usar como nombre de
          modulo, y la carga falla con \`ModuleNotFoundError\`.

          Los cambios de esta version estan en \`changelog\` dentro de
          [metadata.txt](https://github.com/csoto666/qgis-hdfeos-extractor/blob/$TAG/hdfeos_extractor/metadata.txt).
          TXT
          )
          # Si el Release ya existe -por ejemplo creado desde la web- se le
          # adjunta el ZIP en vez de fallar. El objetivo es que el archivo
          # correcto quede publicado, no quien lo creo primero.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "el Release $TAG ya existe; adjunto el ZIP"
            gh release upload "$TAG" hdfeos_extractor-*.zip --clobber
          else
            # --target crea la etiqueta sobre este commit si no existe. Se
            # deja que lo haga gh y no "git tag": el runner no tiene identidad
            # de committer configurada y "git tag -a" falla con
            # "empty ident name", que es como se cayo el primer intento.
            gh release create "$TAG" hdfeos_extractor-*.zip \
              --target "$GITHUB_SHA" --title "$TAG" --notes "$NOTAS"
          fi

      # Sube el MISMO ZIP que acaba de quedar en el Release, no uno armado
      # aparte: lo que se publica y lo que se instala desde QGIS tienen que
      # ser byte por byte el mismo archivo, que es el que paso las pruebas
      # de paquete unos pasos mas arriba.
      #
      # El token se crea en plugins.qgis.org, en la pagina del complemento, y
      # se guarda como secreto QGIS_PLUGIN_TOKEN del repositorio. Sin el
      # secreto este paso se salta y la publicacion en GitHub sigue siendo
      # valida: se puede subir a mano como siempre.
      - name: Subir al repositorio de complementos de QGIS
        env:
          QGIS_PLUGIN_TOKEN: ${{ secrets.QGIS_PLUGIN_TOKEN }}
          PAQUETE: hdfeos_extractor
        run: |
          if [ -z "$QGIS_PLUGIN_TOKEN" ]; then
            echo "Sin QGIS_PLUGIN_TOKEN: no se sube a plugins.qgis.org."
            echo "Crea el token en la pagina del complemento y guardalo en"
            echo "Settings > Secrets and variables > Actions."
            exit 0
          fi
          ZIP=$(ls hdfeos_extractor-*.zip)
          echo "Subiendo $ZIP a plugins.qgis.org"
          # Se captura el codigo y el cuerpo por separado. El sitio responde
          # los errores de validacion en el cuerpo -version repetida, ZIP mal
          # formado, token de otro complemento- y sin imprimirlo el fallo
          # queda en un numero suelto que no dice que arreglar.
          CODIGO=$(curl -sS -w '%{http_code}' -o respuesta.json \
            -H "Authorization: Bearer $QGIS_PLUGIN_TOKEN" \
            -F "package=@$ZIP" \
            "https://plugins.qgis.org/plugins/api/$PAQUETE/version/add/")
          echo "HTTP $CODIGO"
          cat respuesta.json || true
          echo
          if [ "$CODIGO" -lt 200 ] || [ "$CODIGO" -ge 300 ]; then
            echo "La subida fallo. El Release de GitHub si quedo publicado:"
            echo "se puede reintentar subiendo ese mismo ZIP a mano."
            exit 1
          fi
          echo "Publicado en https://plugins.qgis.org/plugins/$PAQUETE/"
